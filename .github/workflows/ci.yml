name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: erlef/setup-beam@v1
        if: runner.os != 'Windows'
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Install Elixir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install elixir --yes --no-progress

      - name: Install and enable Corepack
        run: |
          npm install --global corepack@0.31.0
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Check generated bundles
        shell: bash
        run: |
          git diff --exit-code -- \
            server.bundle.mjs \
            cli.bundle.mjs \
            fetch-worker.bundle.cjs \
            hooks/session-extract.bundle.mjs \
            hooks/session-snapshot.bundle.mjs \
            hooks/session-db.bundle.mjs \
            hooks/checkpoint.bundle.mjs \
            hooks/security.bundle.mjs

      - name: Run all tests
        shell: bash
        run: |
          # Vitest worker cleanup can report Windows EPERM after all suites
          # complete. Fail on actual suite/test failures, not that teardown race.
          set +e
          pnpm exec vitest run 2>&1 | tee /tmp/vitest-output.txt
          VITEST_EXIT=$?
          set -e

          if grep -q "Tests.*failed" /tmp/vitest-output.txt; then
            exit 1
          elif grep -q "Test Files.*failed" /tmp/vitest-output.txt; then
            exit 1
          elif grep -q "Tests.*passed" /tmp/vitest-output.txt; then
            exit 0
          elif grep -q "Error: kill EPERM" /tmp/vitest-output.txt; then
            if grep -qE "FAIL +tests/" /tmp/vitest-output.txt; then
              exit 1
            fi
            exit 0
          else
            exit $VITEST_EXIT
          fi

      - name: Doctor (verify server starts)
        run: pnpm run doctor
        continue-on-error: true

  codex-release-asset:
    runs-on: ubuntu-latest
    name: Codex offline marketplace asset

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Install and enable Corepack
        run: |
          npm install --global corepack@0.31.0
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release inputs
        run: pnpm run build

      - name: Check generated bundles
        run: |
          git diff --exit-code -- \
            server.bundle.mjs \
            cli.bundle.mjs \
            fetch-worker.bundle.cjs \
            hooks/session-extract.bundle.mjs \
            hooks/session-snapshot.bundle.mjs \
            hooks/session-db.bundle.mjs \
            hooks/checkpoint.bundle.mjs \
            hooks/security.bundle.mjs

      - name: Build reproducible offline marketplace asset
        shell: bash
        run: |
          first_output="$(mktemp -d)"
          second_output="$(mktemp -d)"
          pnpm run build:codex-marketplace -- --output-dir "$first_output"
          pnpm run build:codex-marketplace -- --output-dir "$second_output"
          first_archive="$(find "$first_output" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          second_archive="$(find "$second_output" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$first_archive"
          test -n "$second_archive"
          cmp --silent "$first_archive" "$second_archive"
          cp "$first_archive" "$RUNNER_TEMP/context-mode-codex-marketplace.tar.gz"

      - name: Install the pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0

      - name: Verify isolated offline Codex installation
        run: pnpm run verify:codex-marketplace -- "$RUNNER_TEMP/context-mode-codex-marketplace.tar.gz"
