name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing annotated release tag to verify and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"

      - name: Verify pinned Corepack bootstrap
        run: node scripts/run-pnpm.mjs --version

      - name: Resolve source and evidence commits
        id: release_tag
        env:
          RELEASE_TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          tag_name="$RELEASE_TAG_NAME"
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the v<major>.<minor>.<patch> form." >&2
            exit 1
          fi
          git fetch --force origin \
            "refs/tags/$tag_name:refs/tags/$tag_name" \
            "devel:refs/remotes/origin/devel"
          if [[ "$(git cat-file -t "refs/tags/$tag_name")" != "tag" ]]; then
            echo "Release tags must be annotated so the content-manifest digest is auditable." >&2
            exit 1
          fi
          evidence_commit="$(git rev-parse "refs/tags/$tag_name^{commit}")"
          node scripts/validate-fork-release-tag.mjs "$tag_name"
          read -ra commit_line <<< "$(git rev-list --parents -n 1 "$evidence_commit")"
          if [[ "${#commit_line[@]}" -ne 2 ]]; then
            echo "Release evidence commit must have exactly one parent." >&2
            exit 1
          fi
          source_commit="${commit_line[1]}"
          attestation_path="docs/releases/attestations/$tag_name.json"
          expected_change=$'A\t'"$attestation_path"
          actual_change="$(git diff-tree --no-commit-id --name-status -r "$source_commit" "$evidence_commit")"
          if [[ "$actual_change" != "$expected_change" ]]; then
            echo "Release evidence commit must add only $attestation_path." >&2
            exit 1
          fi
          if [[ ! "$(git ls-tree "$evidence_commit" -- "$attestation_path")" =~ ^100644[[:space:]]blob[[:space:]][0-9a-f]{40}[[:space:]] ]]; then
            echo "Release attestation must be a regular tracked file." >&2
            exit 1
          fi
          git checkout --detach "$evidence_commit"
          package_version="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; console.log(packageJson.version)')"
          if [[ "$tag_name" != "v$package_version" ]]; then
            echo "Tag $tag_name does not match package version v$package_version" >&2
            exit 1
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "evidence_commit=$evidence_commit" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: node scripts/run-pnpm.mjs install --frozen-lockfile

      - name: Typecheck
        run: node scripts/run-pnpm.mjs run typecheck

      - name: Build
        run: node scripts/run-pnpm.mjs run build

      - name: Reject generated bundle drift
        run: |
          git diff --exit-code -- \
            server.bundle.mjs \
            cli.bundle.mjs \
            fetch-worker.bundle.cjs \
            hooks/session-extract.bundle.mjs \
            hooks/session-snapshot.bundle.mjs \
            hooks/session-db.bundle.mjs \
            hooks/checkpoint.bundle.mjs \
            hooks/security.bundle.mjs

      - name: Test
        run: node scripts/run-pnpm.mjs test

      - name: Install the pinned Codex CLI
        run: npm install --global @openai/codex@0.146.0

      - name: Build and verify release assets
        id: assets
        shell: bash
        run: |
          release_directory="$RUNNER_TEMP/context-mode-release"
          mkdir -p "$release_directory/npm" "$release_directory/codex" "$release_directory/extracted"
          npm pack --ignore-scripts --pack-destination "$release_directory/npm"
          node scripts/run-pnpm.mjs run build:codex-marketplace -- --output-dir "$release_directory/codex"
          marketplace_archive="$(find "$release_directory/codex" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$marketplace_archive"
          node scripts/run-pnpm.mjs run verify:codex-marketplace -- "$marketplace_archive"
          tar -xzf "$marketplace_archive" -C "$release_directory/extracted"
          cp "$release_directory/extracted/CONTENT-MANIFEST.json" "$release_directory/CONTENT-MANIFEST.json"
          manifest_digest="$(sha256sum "$release_directory/CONTENT-MANIFEST.json" | awk '{print $1}')"
          expected_digest="$(git for-each-ref --format='%(contents)' "refs/tags/${{ steps.release_tag.outputs.tag_name }}" | sed -nE 's/^Codex-Content-Manifest-SHA256:[[:space:]]*([0-9a-f]{64})[[:space:]]*$/\1/p')"
          if [[ "$(printf '%s\n' "$expected_digest" | sed '/^$/d' | wc -l)" -ne 1 ]]; then
            echo "Annotated tag message must contain exactly one Codex-Content-Manifest-SHA256: <64 lowercase hex> line." >&2
            exit 1
          fi
          if [[ "$expected_digest" != "$manifest_digest" ]]; then
            echo "Annotated tag content-manifest digest does not match the built offline asset." >&2
            exit 1
          fi
          marketplace_archive="$(find "$release_directory/codex" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          echo "marketplace_archive=$marketplace_archive" >> "$GITHUB_OUTPUT"
          echo "content_manifest=$release_directory/CONTENT-MANIFEST.json" >> "$GITHUB_OUTPUT"
          echo "release_directory=$release_directory" >> "$GITHUB_OUTPUT"

      - name: Verify immutable native compact attestation
        shell: bash
        run: |
          tag_message_path="$RUNNER_TEMP/context-mode-release-tag-message"
          git for-each-ref --format='%(contents)' \
            "refs/tags/${{ steps.release_tag.outputs.tag_name }}" > "$tag_message_path"
          node scripts/verify-codex-native-release-attestation.mjs \
            --archive "${{ steps.assets.outputs.marketplace_archive }}" \
            --attestation "docs/releases/attestations/${{ steps.release_tag.outputs.tag_name }}.json" \
            --content-manifest "${{ steps.assets.outputs.content_manifest }}" \
            --evidence-commit "${{ steps.release_tag.outputs.evidence_commit }}" \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-commit "${{ steps.release_tag.outputs.source_commit }}" \
            --tag "${{ steps.release_tag.outputs.tag_name }}" \
            --tag-message "$tag_message_path"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.release_tag.outputs.tag_name }}" \
            --generate-notes \
            "${{ steps.assets.outputs.release_directory }}"/npm/*.tgz \
            "${{ steps.assets.outputs.release_directory }}"/codex/*.tar.gz \
            "${{ steps.assets.outputs.release_directory }}"/codex/*.tar.gz.sha256 \
            "${{ steps.assets.outputs.release_directory }}"/CONTENT-MANIFEST.json
