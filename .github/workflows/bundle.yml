name: Bundle Drift Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "hooks/**"
      - "scripts/assert-bundle.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "hooks/**"
      - "scripts/assert-bundle.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  bundle-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm run build

      - name: Reject generated bundle drift
        run: |
          git diff --exit-code -- \
            server.bundle.mjs \
            cli.bundle.mjs \
            fetch-worker.bundle.cjs \
            hooks/session-extract.bundle.mjs \
            hooks/session-snapshot.bundle.mjs \
            hooks/session-db.bundle.mjs \
            hooks/checkpoint.bundle.mjs \
            hooks/security.bundle.mjs
